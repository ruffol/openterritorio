name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Instalar SDK/NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias
        working-directory: app
        run: flutter pub get

      - name: Firma de release (opcional)
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
            echo "APK firmado con la clave de release de los secrets."
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: APK con la debug key del runner; no sirve para OTA entre ejecuciones."
          fi

      - name: Analizar
        working-directory: app
        run: flutter analyze

      - name: Probar
        working-directory: app
        run: flutter test

      - name: Compilar APK armv7
        working-directory: app
        run: |
          for intento in 1 2 3; do
            if flutter build apk --release --target-platform android-arm; then
              exit 0
            fi
            echo "::warning::intento $intento falló (a veces Maven Central responde 429); reintento en 30 s"
            sleep 30
          done
          echo "::error::el APK no compiló tras 3 intentos"
          exit 1

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: openterritorio-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
