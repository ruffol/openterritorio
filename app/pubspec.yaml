name: openterritorio
description: Cliente tactico offline-first para OPENTERITORIO (mapas, GPS y eventos).
publish_to: 'none'
version: 0.9.0+22

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  material_ui: ^1.11.1
  web_socket_channel: ^3.0.3
  http: ^1.2.2
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/osm/
    - assets/vector/
